// Explicit development launcher. The deliverable world will be created in this distinct directory.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.named('runClient').configure {
        workingDir = root.file('run/gt-acceptance')
    }
    root.tasks.named('runServer').configure {
        workingDir = root.file('run/gt-server-acceptance')
        standardInput = System.in
    }
}
