name: Bug Report / 错误报告
description: Report a reproducible problem. / 反馈一个可复现的问题。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please select the affected version from the list before submitting.

        感谢反馈问题。提交前请先从列表中选择受影响版本。

  - type: dropdown
    id: affected_version
    attributes:
      label: Affected Version / 受影响版本
      description: Please select the version where this issue occurs. / 请选择出现该问题的版本。
      options:
        - "MC 1.21.1 / Minecraft 1.21.1"
        - "MC 1.20.1 / Minecraft 1.20.1"
        - "26.1 / 26.1"
        - "Multiple versions / 多个版本"
        - "Not sure / 不确定"
    validations:
      required: true

  - type: input
    id: exact_mod_version
    attributes:
      label: Exact Mod Version / 精确模组版本
      description: Paste the file name or version shown by the mod loader. / 请填写文件名或模组加载器中显示的版本。
      placeholder: "Example / 示例: neoecoae-20.1.0.jar"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority / 优先级
      description: Change this only if the issue seriously affects gameplay. / 仅在该问题严重影响游玩时修改。
      options:
        - "Default / 默认"
        - "High - crash or data loss / 高 - 崩溃或数据丢失"
        - "Medium - blocks normal use / 中 - 阻碍正常使用"
        - "Low - minor issue / 低 - 轻微问题"
    validations:
      required: true

  - type: dropdown
    id: play_environment
    attributes:
      label: Play Environment / 游戏环境
      description: Select where you encountered this issue. / 请选择遇到此问题的游戏环境。
      options:
        - "Single Player / 单人游戏"
        - "Dedicated Server / 专用服务器"
        - "LAN Server / 局域网"
        - "Other / 其他"
    validations:
      required: true

  - type: dropdown
    id: mod_loader
    attributes:
      label: Mod Loader / 模组加载器
      options:
        - "Forge"
        - "NeoForge"
        - "Other / 其他"
    validations:
      required: true

  - type: input
    id: loader_version
    attributes:
      label: Loader Version / 加载器版本
      placeholder: "Example / 示例: Forge 47.4.20"
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior / 预期行为
      description: Describe what you expected to happen. / 请描述你原本预期会发生什么。
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior / 实际行为
      description: Describe what actually happened. / 请描述实际发生了什么。
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce / 复现步骤
      description: Tell us how to reproduce the problem. / 请说明如何复现这个问题。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Crash Report or latest.log / 崩溃报告或 latest.log
      description: Drag and drop log files here, or paste the relevant part. / 请把日志文件拖到这里，或粘贴相关片段。
      render: text
    validations:
      required: false

  - type: textarea
    id: mod_list
    attributes:
      label: Mod List / 模组列表
      description: Include the modpack name/version, or paste the related mod list. / 请填写整合包名称和版本，或粘贴相关模组列表。
    validations:
      required: false
