name: Release Neo ECO AE Extension GTNH Port

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, e.g. v7.3.0-beta2'
        required: true
        type: string
      draft:
        description: 'Create a draft before publishing'
        default: true
        type: boolean
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Resolve version and source
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Expected v7.3.0 or v7.3.0-beta2' >&2
            exit 1
          fi
          if [[ "$MANUAL" == true ]] && git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git checkout --detach "refs/tags/$RELEASE_TAG"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and check
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash ./gradlew build --no-daemon --console=plain "-PreleaseVersion=$RELEASE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Find release notes
        id: notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if [[ -f "docs/release-$RELEASE_TAG.md" ]]; then
            echo "path=docs/release-$RELEASE_TAG.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.version.outputs.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ !steps.notes.outputs.path }}
          fail_on_unmatched_files: true
          files: build/libs/*.jar
