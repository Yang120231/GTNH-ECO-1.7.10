name: CI for Neo ECO AE Extension GTNH Port

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/**
      - src/**
      - docs/**
      - '*.gradle'
      - '*.gradle.kts'
      - gradle.properties
      - gradle/**
      - gradlew*
      - settings.gradle.kts
      - README.md
  pull_request:
    paths:
      - .github/workflows/**
      - src/**
      - docs/**
      - '*.gradle'
      - '*.gradle.kts'
      - gradle.properties
      - gradle/**
      - gradlew*
      - settings.gradle.kts
      - README.md

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: bash ./gradlew build --no-daemon --console=plain

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Neo ECO AE Extension GTNH build
          path: build/libs/*.jar
