# GTNH build conventions; keep this verified toolchain while preparing the port.
gtnh.settings.blowdryerTag = 0.2.2
autoUpdateBuildScript = false

modName = Neo ECO AE Extension
modId = neoecoae
modGroup = cn.dancingsnow.neoecoae
useModGroupForPublishing = true
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/
developmentEnvironmentUserName = Developer

# JDK 17 and Jabel compile the source to Java 8 bytecode.
enableModernJavaSyntax = jabel
enableGenericInjection = true
generateGradleTokenClass = cn.dancingsnow.neoecoae.Tags
gradleTokenVersion = VERSION
replaceGradleTokenInFile =
apiPackage =

# Legacy business mixins and access transformers have been removed.
accessTransformersFile =
usesMixins = false
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage =
coreModClass =
containsMixinsAndOrCoreModOnly = false
# MUI2 still needs the development Mixin runtime.
forceEnableMixins = true

usesShadowedDependencies = false
minimizeShadowedDependencies = true
relocateShadowedDependencies = true
includeWellKnownRepositories = true
excludeWellKnownRepositories =
usesMavenPublishing = false
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =

org.gradle.configuration-cache = false
org.gradle.parallel = true

# Pinned target platform APIs from the porting investigation.
ae2Version = rv3-beta-1095-GTNH
modularUi2Version = 2.3.94-1.7.10
gtnhLibVersion = 0.11.54
